		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<style>#status-splash{display:none!important}#status{background:#10252f;font:18px system-ui}#download{position:absolute;top:40%;left:10%;right:10%;text-align:center;color:#b5d8dc}#portrait{display:none;position:fixed;inset:0;z-index:30;background:#10252f;color:#e8f1ee;align-items:center;justify-content:center;text-align:center;padding:32px;font:20px system-ui}#portrait p{max-width:300px}@media(orientation:portrait) and (max-width:700px){#portrait{display:flex}}canvas{touch-action:none}body{overscroll-behavior:none}</style>
	<script>
// CI replaces the placeholder with the deployed Worker URL; empty means same-origin.
window.BLACKWAKE_API_BASE="";
// Cloud-backed expedition checkpoints. The save lives on the server; the browser keeps only the player key
// (shown in-game as the recovery code) that proves which save this device plays.
window.blackwakeSave={status:'loading',state:null,revision:0,loaded:false,pending:null,busy:false,error:'',blocked:false,key:'',keyStored:true,recoveryMessage:'',
 api(){const b=window.BLACKWAKE_API_BASE;return(typeof b==='string'&&b&&!b.startsWith('__')?b.replace(/\/+$/,''):'')+'/api/progress';},
 headers(key,json){const h={Authorization:'Bearer '+key};if(json)h['Content-Type']='application/json';return h;},
 initKey(){const slot='blackwake.playerKey';let key='';
  try{const saved=localStorage.getItem(slot);if(saved&&/^[0-9a-f]{32}$/.test(saved))key=saved;}catch{}
  if(!key){const bytes=crypto.getRandomValues(new Uint8Array(16));key=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
   try{localStorage.setItem(slot,key);this.keyStored=localStorage.getItem(slot)===key;}catch{this.keyStored=false;}}
  this.key=key;},
 recoveryCode(){return this.key.toUpperCase().match(/.{4}/g).join('-');},
 copyCode(){const code=this.recoveryCode();
  const manual=()=>{this.recoveryMessage='Copy blocked. Select the code and copy it by hand.';try{window.prompt('Your recovery code',code);}catch{}};
  try{navigator.clipboard.writeText(code).then(()=>{this.recoveryMessage='Recovery code copied.';},manual);}catch{manual();}},
 async useRecoveryCode(input,confirmFn){
  const fail=error=>{this.recoveryMessage=error;return{ok:false,error};};
  const key=String(input||'').replace(/[\s-]/g,'').toLowerCase();
  if(!/^[0-9a-f]{32}$/.test(key))return fail('That is not a recovery code. It is 32 letters and numbers (0-9, A-F).');
  if(key===this.key)return fail('That is already this device’s recovery code.');
  try{const r=await fetch(this.api(),{cache:'no-store',headers:this.headers(key)});const d=await r.json();
   if(!r.ok)throw Error(d.error||'Could not check that code.');
   if(!d.revision)return fail('No save was found for that code. Check it and try again.');
  }catch(e){return fail(e.message||'Could not check that code. Try again online.');}
  const ask=confirmFn||(m=>window.confirm(m));
  if(!ask('Switch this device to the save for that recovery code? This device will stop playing its current save. Keep the current recovery code (Recovery menu) if you want to return to it.')){this.recoveryMessage='Recovery cancelled.';return{ok:false,cancelled:true};}
  if(this.pending&&this.loaded&&!this.blocked)await this.flush();
  try{localStorage.setItem('blackwake.playerKey',key);if(localStorage.getItem('blackwake.playerKey')!==key)throw Error();}catch{return fail('This browser blocks storage, so it cannot switch saves.');}
  this.recoveryMessage='Switching saves…';location.reload();return{ok:true};},
 enterCode(){const text=window.prompt('Enter your recovery code (from the Recovery menu on your other device):');if(text===null)return Promise.resolve({ok:false,cancelled:true});return this.useRecoveryCode(text);},
 async load(){this.status='loading';try{const r=await fetch(this.api(),{cache:'no-store',headers:this.headers(this.key)});if(!r.ok)throw Error('Could not load progress. Retry before playing.');const d=await r.json();this.state=d.state;this.revision=d.revision;this.loaded=true;this.status='saved';this.error='';}catch(e){this.status='error';this.error=e.message;}},
 save(state){this.pending=state;if(this.loaded&&!this.blocked)this.flush();},
 async flush(){if(this.busy||!this.pending||this.blocked)return;this.busy=true;const state=this.pending;this.pending=null;this.status='saving';try{const r=await fetch(this.api(),{method:'PUT',headers:this.headers(this.key,true),body:JSON.stringify({revision:this.revision,state})});const d=await r.json();if(!r.ok){if(r.status===409)this.blocked=true;throw Error(d.error||'Save unavailable. Retry.');}this.revision=d.revision;this.state=state;this.status='saved';this.error='';}catch(e){if(!this.pending)this.pending=state;this.status='error';this.error=e.message;}finally{this.busy=false;}if(this.pending&&this.status==='saved')this.flush();},
 retry(){if(this.blocked){location.reload();return;}if(!this.loaded)this.load();else this.flush();}
};
window.blackwakeSave.initKey();
window.blackwakeSave.load();

</script>

<div id="download">Loading Blackwake Den…</div>
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>

		<script>
const originalFetch=window.fetch.bind(window);
window.fetch=async function(input,options){
 const url=typeof input==='string'?input:(input.url||String(input));
 if(!new URL(url,location.href).pathname.endsWith('/index.wasm'))return originalFetch(input,options);
 const buffers=[];let downloaded=0;const total=38200000;
 for(let i=0;i<2;i++){
  const response=await originalFetch(new URL('index.wasm.part'+i,location.href),options);
  if(!response.ok)throw new Error('Game download failed. Reload to retry.');
  const reader=response.body.getReader();
  while(true){const {value,done}=await reader.read();if(done)break;buffers.push(value);downloaded+=value.byteLength;const label=document.getElementById('download');if(label)label.textContent='Loading Blackwake Den… '+Math.min(99,Math.round(downloaded/total*100))+'%';}
 }
 const merged=new Uint8Array(downloaded);let offset=0;
 for(const chunk of buffers){merged.set(chunk,offset);offset+=chunk.byteLength;}
 return new Response(merged,{status:200,headers:{'Content-Type':'application/wasm','Content-Length':String(downloaded)}});
};
</script>
<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":5759936,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
