<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#0a0710">
		<title>Blackwake Den</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #0a0710;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen: text and torch glow only. Replaces the stock Godot splash. */
#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	background: #0a0710;
	font-family: Georgia, 'Times New Roman', serif;
	visibility: hidden;
	overflow: hidden;
}

#glow {
	position: absolute;
	left: 50%;
	top: 46%;
	width: 90vmin;
	height: 90vmin;
	margin: -45vmin 0 0 -45vmin;
	border-radius: 50%;
	background: radial-gradient(circle, rgba(255, 168, 82, 0.34) 0%, rgba(214, 104, 40, 0.16) 38%, rgba(10, 7, 16, 0) 70%);
	animation: flicker 2.6s ease-in-out infinite;
}

@keyframes flicker {
	0%, 100% { opacity: 0.85; transform: scale(1); }
	18% { opacity: 1; transform: scale(1.04); }
	41% { opacity: 0.74; transform: scale(0.98); }
	63% { opacity: 0.95; transform: scale(1.03); }
	82% { opacity: 0.8; transform: scale(1); }
}

#title, #tagline, #bar, #percent, #status-notice {
	position: relative;
}

#title {
	margin: 0;
	font-size: clamp(30px, 8vmin, 64px);
	font-weight: normal;
	letter-spacing: 0.22em;
	text-indent: 0.22em;
	color: #f3d9a4;
	text-shadow: 0 0 22px rgba(255, 150, 60, 0.55), 0 2px 0 #1a0d08;
}

#tagline {
	margin: 1.1em 0 2em;
	font-size: clamp(14px, 2.6vmin, 20px);
	font-style: italic;
	letter-spacing: 0.08em;
	color: #b79a6c;
	min-height: 1.4em;
}

#bar {
	width: min(56vw, 360px);
	height: 6px;
	border: 1px solid #6b5535;
	border-radius: 4px;
	background: #150f12;
	overflow: hidden;
}

#fill {
	width: 0%;
	height: 100%;
	background: linear-gradient(90deg, #a8541f, #ffb062);
	box-shadow: 0 0 10px rgba(255, 160, 80, 0.7);
	transition: width 0.25s ease-out;
}

#bar.indeterminate #fill {
	width: 35%;
	animation: slide 1.4s ease-in-out infinite;
}

@keyframes slide {
	0% { margin-left: -35%; }
	100% { margin-left: 100%; }
}

#percent {
	margin-top: 0.8em;
	font-size: 13px;
	letter-spacing: 0.12em;
	color: #7d6847;
	font-variant-numeric: tabular-nums;
	min-height: 1.2em;
}

#status-notice {
	display: none;
	max-width: min(80vw, 480px);
	margin-top: 1.5em;
	padding: 1rem;
	border: 1px solid #9b3943;
	border-radius: 0.5rem;
	background-color: #3a1c22;
	color: #e8d9d9;
	font-family: system-ui, sans-serif;
	line-height: 1.3;
	text-align: center;
}

@media (prefers-reduced-motion: reduce) {
	#glow, #bar.indeterminate #fill { animation: none; }
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="glow"></div>
			<h1 id="title">BLACKWAKE DEN</h1>
			<div id="tagline">Lighting the torches…</div>
			<div id="bar" class="indeterminate"><div id="fill"></div></div>
			<div id="percent"></div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9547796,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusBar = document.getElementById('bar');
	const statusFill = document.getElementById('fill');
	const statusPercent = document.getElementById('percent');
	const statusTagline = document.getElementById('tagline');
	const statusNotice = document.getElementById('status-notice');

	const lines = ['Lighting the torches…', 'Raking the pit sand…', 'Oiling the gates…', 'Hanging the banners…'];
	let lineIndex = 0;
	let initializing = true;
	let ticker = setInterval(function () {
		lineIndex = (lineIndex + 1) % lines.length;
		statusTagline.textContent = lines[lineIndex];
	}, 2600);

	function showProgress() {
		statusOverlay.style.visibility = 'visible';
	}

	function finish() {
		initializing = false;
		clearInterval(ticker);
		statusOverlay.remove();
	}

	function displayFailureNotice(err) {
		console.error(err);
		let text = 'An unknown error occurred.';
		if (err instanceof Error) {
			text = err.message;
		} else if (typeof err === 'string') {
			text = err;
		}
		clearInterval(ticker);
		statusOverlay.style.visibility = 'visible';
		statusBar.style.display = 'none';
		statusPercent.style.display = 'none';
		statusTagline.textContent = 'The gates would not open.';
		statusNotice.textContent = '';
		text.split('\n').forEach(function (line) {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		statusNotice.style.display = 'block';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Error\nThe following features required to run Blackwake Den in this browser are missing:\n' + missing.join('\n'));
	} else {
		showProgress();
		engine.startGame({
			'onProgress': function (current, total) {
				if (!initializing) {
					return;
				}
				if (current > 0 && total > 0) {
					const fraction = Math.min(1, current / total);
					statusBar.classList.remove('indeterminate');
					statusFill.style.width = (fraction * 100).toFixed(1) + '%';
					statusPercent.textContent = Math.floor(fraction * 100) + '%';
				} else {
					statusBar.classList.add('indeterminate');
					statusPercent.textContent = '';
				}
			},
		}).then(finish, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
